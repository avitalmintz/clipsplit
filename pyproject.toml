[project]
name = "clipsplit"
version = "0.1.0"
description = "Auto-split a screen recording into named clips, 100% on-device."
requires-python = ">=3.12"
dependencies = [
    "ocrmac==1.0.1",
    "pyobjc-core==12.2.1",
    "pyobjc-framework-Vision==12.2.1",
    "pillow==12.3.0",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.1",
    "imageio-ffmpeg==0.6.0",
    "gradio==6.19.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clipsplit"]
